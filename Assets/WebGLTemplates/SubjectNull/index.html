<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>{{{ PRODUCT_NAME }}}</title>
    <!-- 파비콘: 루트 favicon.ico를 우선 참조(브라우저가 /favicon.ico를 자동 요청하므로 루트에도 파일을 둔다).
         구식 rel="shortcut icon" 대신 rel="icon"을 쓰고, 캐시 무력화용 쿼리를 붙였다. -->
    <link rel="icon" href="favicon.ico?v=2" sizes="any">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- PayPal 결제 SDK. client-id는 공개값(브라우저 노출 전제) — Secret은 서버(Cloud Code)에만 있다.
         Sandbox/Live 전환 시 이 client-id도 함께 바꿔야 한다. -->
    <script src="https://www.paypal.com/sdk/js?client-id=Aet2aPabSiSBZQUSk15-XiE1pt5SZwx22AasHkpWFvHI8j4EE7StfMCNiQ0cYXBKTNtOW6nttPDfvoDt&currency=USD"></script>
    <style>
      /* SUBJECT:NULL — 창 크기에 맞춰 16:9 유지(레터박스) */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #07090c; overflow: hidden; }

      /* 모바일 브라우저의 기본 터치 동작이 조작을 방해한다.
         touch-action  : 스크롤·핀치 확대·더블탭 확대·풀투리프레시 차단
         user-select   : 길게 누를 때 텍스트 선택 방지
         touch-callout : iOS 롱프레스 시 뜨는 컨텍스트 메뉴 방지
         이게 없으면 조이스틱을 밀 때 화면이 같이 움직이거나 확대된다. */
      html, body, #unity-container, #unity-canvas {
        touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }

      /* 세로로 들었을 때 안내 — 이 게임은 가로 전용이다 */
      #rotate-notice {
        position: fixed; inset: 0; display: none;
        align-items: center; justify-content: center; text-align: center;
        background: #07090c; color: #cfd6e4; z-index: 99;
        font-family: system-ui, -apple-system, sans-serif; font-size: 18px; line-height: 1.8;
      }
      #unity-container { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #07090c; }
      #unity-canvas { background: #07090c; }
      #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
      #unity-warning { position: absolute; left: 50%; top: 5%; transform: translate(-50%); }
      #unity-fullscreen-button { position: absolute; right: 12px; bottom: 12px; cursor: pointer; opacity: 0.6; }
      #unity-fullscreen-button:hover { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="rotate-notice">📱<br>가로로 돌려주세요<br><span style="font-size:14px;opacity:.6">이 게임은 가로 화면 전용입니다</span></div>
    <div id="unity-container">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-fullscreen-button" title="전체화면"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      // 브라우저 창 안에서 16:9 비율을 유지하며 최대 크기로 표시 (남는 영역은 레터박스)
      var gameAspect = {{{ WIDTH }}} / {{{ HEIGHT }}};
      function fitCanvas() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        if (w / h > gameAspect) w = Math.round(h * gameAspect);
        else h = Math.round(w / gameAspect);
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
      }
      // 모바일에서 세로로 들면 안내를 띄운다(가로 전용 게임).
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      function checkOrientation() {
        if (!isMobile) return;
        var portrait = window.innerHeight > window.innerWidth;
        document.getElementById('rotate-notice').style.display = portrait ? 'flex' : 'none';
      }

      window.addEventListener('resize', function () { fitCanvas(); checkOrientation(); });
      window.addEventListener('orientationchange', function () {
        // 방향 전환 직후에는 창 크기가 아직 갱신되지 않는 기기가 있다
        setTimeout(function () { fitCanvas(); checkOrientation(); }, 200);
      });
      fitCanvas();
      checkOrientation();

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
